name: Update public profiles

# Refreshes src/data/publicProfiles.json (GitHub commits, repos, languages and Codewars stats).
# The commit it pushes triggers the site's normal deploy.
on:
    schedule:
        - cron: "0 */6 * * *"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - run: node scripts/updatePublicProfiles.mjs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Commit when the data changed
              run: |
                  if git diff --quiet -- src/data/publicProfiles.json; then
                      echo "No changes."
                      exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add src/data/publicProfiles.json
                  git commit -m "chore: update public profiles data"
                  git push
