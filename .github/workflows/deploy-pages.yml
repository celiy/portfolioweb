name: Deploy to GitHub Pages

# Builds the site from scratch and publishes it, so docs/ never needs to be committed.
# The build lives in cht-main, so the workflow checks it out and puts this repo inside it.
on:
    push:
        branches: [main]
    schedule:
        - cron: "0 */6 * * *"
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4
              with:
                  repository: celiy/cht-main
                  ref: main
                  path: cht-main

            - uses: actions/checkout@v4
              with:
                  path: cht-main/portfolioweb

            # Follows the main branch of cht-base, cht-design-system and cht-shared
            - name: Fetch the core repos
              working-directory: cht-main
              run: git submodule update --init --remote

            - uses: actions/setup-node@v4
              with:
                  node-version-file: cht-main/.nvmrc

            - name: Install dependencies
              working-directory: cht-main
              run: node scripts/entry.mjs install --skip-git --client:portfolioweb

            # Fresh GitHub and Codewars data goes into this build; nothing is committed
            - name: Update the profile data
              working-directory: cht-main
              run: node portfolioweb/scripts/updatePublicProfiles.mjs
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Build the site
              working-directory: cht-main
              run: node portfolioweb/scripts/buildDocs.mjs ./site

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: cht-main/site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
